# Mosquitto de la Raspberry Pi: recibe las tramas de los nodos (NodeMCU) y las entrega a la pasarela.
# El archivo de usuarios (passwd) lo crea docker-compose al arrancar a partir de MQTT_USER y MQTT_PASS (.env).
listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd

# Las tramas ya están guardadas en la cola de la pasarela; el broker solo guarda lo mínimo.
persistence true
persistence_location /mosquitto/data/
max_packet_size 8192
