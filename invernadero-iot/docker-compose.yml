# Raspberry Pi: sistema completo que funciona SIN internet (todo en la red local) y envía a la nube (AWS) cada 5 s.
#
#   nodos ──ESP-NOW (malla)──► concentrador (ESP) ──USB──► puente ──/relay──► gateway ──► postgres (local) ◄── dashboard :3000
#   (NodeMCU por MQTT :1883 ──► mosquitto ──────────────────────────────────────┘             │
#                                                                                               ├── uplink (cada 5 s) ──HTTPS, cifrado──► AWS
#                                                                                               └── sync (opcional)  ──────────────────► Supabase
#
#   docker compose up -d --build        arranca todo (y se reinicia solo con la Pi)
#   docker compose logs -f gateway      ver lo que llega de los nodos        (también: dashboard, sync, postgres)
#   docker compose down                 detiene (los datos viven en volúmenes y se conservan)
#
# Primera vez: ver docs/gateway-raspberry.md (arranque inicial con `docker compose run --rm bootstrap`).
# Requisitos: .env (ver .env.example). La base local NO se publica a la red: solo la ven los demás contenedores.

x-tools: &tools
  build:
    context: .
    dockerfile: dashboard/Dockerfile.gateway
  image: invernadero-iot-tools

x-db-app: &db-app                    # base local, con el rol de la aplicación (sin privilegios de administrador)
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: iot
  DATABASE_SSL_MODE: disable         # tráfico interno entre contenedores
  DATABASE_USER: iot_app
  DATABASE_PASSWORD: ${IOT_APP_PASSWORD:?defina IOT_APP_PASSWORD en .env}

x-logging: &log                     # los registros rotan (3 × 10 MB por servicio): una Pi sin atención no llena la SD
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-supabase: &supabase
  SUPABASE_DB_HOST: ${SUPABASE_DB_HOST:-}
  SUPABASE_DB_PORT: ${SUPABASE_DB_PORT:-5432}
  SUPABASE_DB_NAME: ${SUPABASE_DB_NAME:-postgres}
  SUPABASE_DB_USER: ${SUPABASE_DB_USER:-}
  SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-}
  SUPABASE_DB_SSL_MODE: ${SUPABASE_DB_SSL_MODE:-verify}

services:
  postgres:
    logging: *log
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: iot
      TZ: ${TZ:-America/Santiago}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iot"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Aplica las migraciones (supabase/migrations) y habilita el rol de la aplicación. Corre una vez por arranque y termina.
  migrate:
    logging: *log
    <<: *tools
    restart: "no"
    command: ["node", "--import", "tsx", "scripts/db-migrate.ts"]
    environment:
      <<: *db-app
      DATABASE_ADMIN_USER: postgres
      DATABASE_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  mosquitto:
    logging: *log
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    environment:
      MQTT_USER: ${MQTT_USER:?defina MQTT_USER en .env}
      MQTT_PASS: ${MQTT_PASS:?defina MQTT_PASS en .env}
    # Crea el archivo de usuarios con las credenciales de .env y arranca el broker.
    command:
      - sh
      - -c
      - |
        mosquitto_passwd -b -c /mosquitto/data/passwd "$$MQTT_USER" "$$MQTT_PASS"
        chown mosquitto:mosquitto /mosquitto/data/passwd
        chmod 600 /mosquitto/data/passwd
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -u \"$$MQTT_USER\" -P \"$$MQTT_PASS\" -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null"]
      interval: 15s
      timeout: 6s
      retries: 4
      start_period: 5s

  # Recibe las tramas de los nodos (MQTT, o HTTP en :3100) y las guarda al instante en la base local.
  gateway:
    logging: *log
    <<: *tools
    restart: unless-stopped
    environment:
      <<: *db-app
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USER: ${MQTT_USER}
      MQTT_PASS: ${MQTT_PASS}
      MQTT_AES_KEY: ${MQTT_AES_KEY:-}            # clave AES compartida con los nodos (32 hex = AES-128, 64 hex = AES-256); vacía = sin AES (docs/cifrado-mqtt.md)
      MQTT_CIFRADO: ${MQTT_CIFRADO:-permitir}    # permitir = todo · exigir = solo aes o rsa · exigir-rsa = solo rsa (clave pública/privada)
      MQTT_RSA_PRIVATE_KEY_FILE: /run/secrets/mqtt-rsa-private.pem   # clave PRIVADA de la Pi (modo rsa); si el archivo no existe, no hay rsa
      ACEPTAR_NODOS_NUEVOS: ${ACEPTAR_NODOS_NUEVOS:-0}   # PRUEBAS: 1 = acepta cualquier identificador («GRUPO-A») y da de alta los nodos nuevos solos (docs/malla-espnow.md). NO en produccion
      GATEWAY_PORT: "3100"
      TZ: ${TZ:-America/Santiago}
    volumes:
      - ./secrets:/run/secrets:ro      # carpeta con mqtt-rsa-private.pem (solo en la Pi; fuera de git). Ver docs/cifrado-mqtt.md
    ports:
      - "3100:3100"                    # solo para nodos que usen HTTP en vez de MQTT, y /api/health
    depends_on:
      mosquitto:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Interfaz web y API REST (/api/v1) para toda la red local: http://IP_DE_LA_PI:3000
  dashboard:
    logging: *log
    build:
      context: .
      dockerfile: dashboard/Dockerfile.dashboard
    image: invernadero-iot-dashboard
    restart: unless-stopped
    environment:
      <<: *db-app
      APP_SECRET: ${APP_SECRET:?defina APP_SECRET en .env (mínimo 32 caracteres)}
      MFA_REQUIRED_ROLES: ${MFA_REQUIRED_ROLES:-}
      FORCE_HTTPS: "false"             # red local por HTTP; con un proxy HTTPS delante, cámbielo a "true"
      TZ: ${TZ:-America/Santiago}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Copia a Supabase lo nuevo cada SYNC_INTERVAL_S (5 min). Sin internet no hace nada y reintenta; la Pi no se afecta.
  sync:
    logging: *log
    <<: *tools
    restart: unless-stopped
    command: ["node", "--import", "tsx", "scripts/sync.ts"]
    environment:
      <<: [*db-app, *supabase]
      SYNC_INTERVAL_S: ${SYNC_INTERVAL_S:-300}
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Envía a la nube (AWS) lo nuevo cada UPLINK_INTERVAL_S (5 s), cifrado con la clave pública de AWS. Sin AWS_UPLINK_URL queda inactivo.
  # Es el último tramo del diagrama: la Pi guarda todo en local y solo ella habla con la nube.
  uplink:
    logging: *log
    <<: *tools
    restart: unless-stopped
    command: ["node", "--import", "tsx", "scripts/uplink.ts"]
    environment:
      <<: *db-app
      AWS_UPLINK_URL: ${AWS_UPLINK_URL:-}
      AWS_UPLINK_API_KEY: ${AWS_UPLINK_API_KEY:-}
      AWS_PUBLIC_KEY_FILE: ${AWS_PUBLIC_KEY_FILE:-}     # p. ej. /run/secrets/aws-public.pem (clave PÚBLICA de AWS; la privada solo la tiene AWS)
      UPLINK_INTERVAL_S: ${UPLINK_INTERVAL_S:-5}
      UPLINK_SIN_CIFRAR: ${UPLINK_SIN_CIFRAR:-0}        # 1 = sin cifrar, SOLO para pruebas
    volumes:
      - ./secrets:/run/secrets:ro
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Puente con el CONCENTRADOR (un ESP por USB que oye la malla ESP-NOW). Solo en la Pi, con el ESP conectado:
  #   CONCENTRADOR_DEV=/dev/ttyUSB0 docker compose --profile concentrador up -d puente
  # (En el PC con Windows no se usa Docker para esto: corra `npm run puente -- COM4` en dashboard/.)
  puente:
    logging: *log
    <<: *tools
    profiles: ["concentrador"]
    restart: unless-stopped
    command: ["node", "--import", "tsx", "scripts/puente-serie.ts", "${CONCENTRADOR_DEV:-/dev/ttyUSB0}"]
    environment:
      GATEWAY_URL: http://gateway:3100
    devices:
      - "${CONCENTRADOR_DEV:-/dev/ttyUSB0}:${CONCENTRADOR_DEV:-/dev/ttyUSB0}"
    group_add:
      - dialout                                         # permiso para abrir el puerto serie
    healthcheck:
      disable: true
    depends_on:
      gateway:
        condition: service_started

  # ---- Herramientas de una sola vez (no arrancan con `up`; se usan con `docker compose run --rm <nombre>`) ----

  # Trae de Supabase a la base local lo que ya existe (usuarios, invernaderos, token del nodo, historial). Una sola vez.
  #   docker compose run --rm bootstrap            (falla si la base local ya tiene datos; --force para reemplazar)
  bootstrap:
    logging: *log
    <<: *tools
    profiles: ["tools"]
    restart: "no"
    command: ["node", "--import", "tsx", "scripts/sync-bootstrap.ts"]
    environment:
      <<: [*db-app, *supabase]
      DATABASE_ADMIN_USER: postgres
      DATABASE_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Claves de la API REST:  docker compose run --rm tools crear correo@predio.local "Mi app"   |   listar   |   revocar <id>
  tools:
    logging: *log
    <<: *tools
    profiles: ["tools"]
    restart: "no"
    entrypoint: ["node", "--import", "tsx", "scripts/api-key.ts"]
    environment:
      <<: *db-app
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  mosquitto-data:
